<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
<title>Tel Morais</title>
</head>
<body>
<main id="app"></main>
<div id="timer" hidden>
  <div class="row"><div class="tt" id="tt">0:00</div><div class="sp"><div class="b" id="tlab">Descanso</div><div class="tl" id="tsub"></div></div>
  <button class="btn smb" data-act="tAdd" data-s="-15">−15</button><button class="btn smb" data-act="tAdd" data-s="15">+15</button><button class="btn smb" data-act="tClose">✕</button></div>
  <div class="tbar" id="tbar"></div>
</div>
<nav id="tabs">
  <button data-act="tab" data-t="hoje"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>Hoje</button>
  <button data-act="tab" data-t="treinos"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Treinos</button>
  <button data-act="tab" data-t="avaliacao"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/></svg>Avaliação</button>
  <button data-act="tab" data-t="progresso"><svg viewBox="0 0 24 24"><path d="M3.5 20h17M5 16l4.5-5 4 3L20 6.5"/><path d="M15.5 6.5H20V11"/></svg>Progresso</button>
  <button data-act="tab" data-t="perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5c1.2-3.8 4-5.7 7.5-5.7s6.3 1.9 7.5 5.7"/></svg>Ajustes</button>
</nav>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script src="supabase.min.js"></script>
<script src="avaliacao.js"></script>
<script src="modelos.js"></script>
<script src="exercicios.js"></script>
<script src="js/catalogo.js"></script>
<script src="js/midia.js"></script>
<script src="js/app.js"></script>
</body>
</html>
